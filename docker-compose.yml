name: globus

# Шаблон backend-екземпляра: один образ, одна кодова база, ізольований життєвий цикл.
# Портів назовні НЕМАЄ: екземпляри доступні лише через балансувальник (інкапсуляція, ЛР3).
x-app: &app
  build: .
  command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  expose:
    - "8000"
  # Обмеження CPU робить кожен екземпляр «невеликим сервером»,
  # щоб ефект горизонтального масштабування було видно в експерименті 1/2/3.
  cpus: ${APP_CPUS:-0.5}
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks:
    - backend
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 10
  restart: unless-stopped

x-db-url: &db-url postgresql+asyncpg://globus:globus@db:5432/globus

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: globus
      POSTGRES_PASSWORD: globus
      POSTGRES_DB: globus
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globus -d globus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Одноразовий сервіс міграцій (з ЛР2).
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # Пул із трьох реплік. Відрізняються лише INSTANCE_ID і (для експерименту) затримкою.
  app1:
    <<: *app
    environment:
      DATABASE_URL: *db-url
      INSTANCE_ID: app-1
      ARTIFICIAL_DELAY_MS: ${APP1_DELAY_MS:-0}

  app2:
    <<: *app
    environment:
      DATABASE_URL: *db-url
      INSTANCE_ID: app-2
      ARTIFICIAL_DELAY_MS: ${APP2_DELAY_MS:-0}

  app3:
    <<: *app
    environment:
      DATABASE_URL: *db-url
      INSTANCE_ID: app-3
      ARTIFICIAL_DELAY_MS: ${APP3_DELAY_MS:-0}

  # Єдина точка входу: http://localhost:8000. Статистика балансувальника: http://localhost:8404
  lb:
    image: haproxy:2.8-alpine
    volumes:
      - ./haproxy:/usr/local/etc/haproxy:ro
    ports:
      - "8000:8080"
      - "8404:8404"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@globus.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  pgadmin_data:

networks:
  backend:
