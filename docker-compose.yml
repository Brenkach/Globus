name: globus

services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: globus
      POSTGRES_PASSWORD: globus
      POSTGRES_DB: globus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U globus -d globus"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Одноразовий сервіс міграцій. Раніше міграції запускались у кожному контейнері app при старті,
  # а при двох instances вони б виконувались паралельно (гонка за alembic_version).
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://globus:globus@db:5432/globus
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  # Два однакових instances одного образу. Відрізняються лише INSTANCE_ID.
  app1: &app
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://globus:globus@db:5432/globus
      INSTANCE_ID: app-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8000"   # прямий доступ до instance 1 (для перевірки cross-instance сценаріїв)
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app2:
    <<: *app
    environment:
      DATABASE_URL: postgresql+asyncpg://globus:globus@db:5432/globus
      INSTANCE_ID: app-2
    ports:
      - "8002:8000"   # прямий доступ до instance 2

  # Єдина точка входу: http://localhost:8000 (як і в лабораторній 1).
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@globus.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

volumes:
  pgdata:
  pgadmin_data:

networks:
  backend:
