# HAProxy: єдина точка входу (Single Entry Point) для пулу stateless-екземплярів Globus.
# Клієнти бачать лише :8000. Екземпляри app1..app3 доступні тільки у внутрішній мережі Docker.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    option dontlognull

    timeout connect 2s
    timeout client  30s
    timeout server  30s
    # Скільки чекати відповіді на health check. Під піковим навантаженням вузол відповідає повільніше,
    # і надто короткий таймаут виключав би з пулу живі, але завантажені вузли (flapping).
    timeout check   5s

    # Fault tolerance: якщо вузол не прийняв з'єднання або обірвав його без відповіді,
    # запит повторюється на ІНШОМУ вузлі (redispatch), і клієнт не бачить 5xx.
    retries 3
    option redispatch 1
    retry-on conn-failure empty-response response-timeout

# Docker DNS: адреси екземплярів перерезолвлюються під час роботи,
# тож зупинений/перезапущений контейнер коректно виходить з пулу й повертається.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid    5s
    hold other    5s
    hold refused  5s
    hold nx       5s
    hold timeout  5s
    hold obsolete 5s

frontend api
    bind *:8080
    default_backend globus_api
    # Яким вузлом обслужено запит з погляду балансувальника (доповнює X-Instance-ID від застосунку).
    http-response set-header X-Upstream %[srv_name]

backend globus_api
    # Активний health check: HAProxy сам кожні 2 с опитує GET /health.
    # 3 невдачі поспіль (fall 3) = вузол DOWN і виключається з пулу;
    # 2 успіхи поспіль (rise 2) = вузол повертається.
    option httpchk GET /health
    http-check expect status 200

    # Пасивна перевірка: помилки на реальному трафіку теж виводять вузол з пулу.
    default-server inter 2s fall 3 rise 2 check observe layer7 error-limit 5 on-error mark-down resolvers docker init-addr last,libc,none

    # >>> POOL: керується скриптом scripts/lb_switch.py (не редагуйте вручну між маркерами)
    balance roundrobin
    server app1 app1:8000
    server app2 app2:8000
    server app3 app3:8000
    # <<< POOL

# Сторінка статистики: стан вузлів (UP/DOWN), кількість запитів і з'єднань на кожен.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends
