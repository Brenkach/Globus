# Балансувальник навантаження: round-robin БЕЗ sticky sessions (немає ip_hash / cookie).
# Кожен запит може потрапити на будь-який instance, бо стан лежить у PostgreSQL.
upstream globus_api {
    server app1:8000;
    server app2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://globus_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # Якщо вузол недоступний (зупинений/впав), запит прозоро йде на інший.
        # Повтор безпечний: nginx повторює лише якщо з'єднання не вдалося, тобто запит ще не оброблявся.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
    }
}
